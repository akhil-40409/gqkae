[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gqe"
version = "0.4.0"
description = "GQE/GQKAE generative circuit search for Ising and QUBO problems (PennyLane + JAX + Catalyst)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pennylane==0.45.1",
  "pennylane-lightning==0.45.0",
  "pennylane-catalyst==0.15.0",
  "jax==0.7.1",
  "jaxlib==0.7.1",
  "optax==0.2.6",
  "numpy>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "ipykernel>=6.0"]

[project.scripts]
gqe = "gqe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
